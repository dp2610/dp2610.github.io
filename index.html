<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  /* Tailwind theme extension: all brand colours live here.
     Change `accent` / `accent2` to re-skin the whole site.       */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          void:    '#000000',   // pure black page background
          deep:    '#07070A',   // panel background
          slate1:  '#0E0E14',   // card background
          line:    '#1C1C26',   // hairline borders
          accent:  '#7FA9FF',   // the single accent — change this one value to re-skin
          accent2: '#7FA9FF',
          accent3: '#7FA9FF',
        },
        fontFamily: {
          display: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          body:    ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],

<style>
  /* ============================================================
     BASE + CUSTOM EFFECTS
     (Everything Tailwind can't express lives here)
     ============================================================ */
  :root { color-scheme: dark; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body { background: #000; color: #E8E8ED; overflow-x: hidden; }
  ::selection { background: #7FA9FF; color: #04080F; }

  /* Thin custom scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #1C1C26; border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: #2A2A38; }

  /* Fixed starfield + atmosphere layers */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .nebula {                       /* soft coloured haze behind content */
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(70% 50% at 75% 8%, rgba(127,169,255,.05), transparent 65%),
      radial-gradient(60% 50% at 10% 70%, rgba(255,255,255,.028), transparent 65%);
  }
  .vignette {                     /* darkens the edges for depth */
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 80% at 50% 0%, transparent 45%, rgba(0,0,0,.75) 100%);
  }

  /* Gradient text helper */
  .grad-text { color: #FFFFFF; }   /* headings stay plain white */
  /* Glass panel used by cards, nav and the form */
  .glass {
    background: linear-gradient(160deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
    border: 1px solid #1C1C26;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  /* Card hover: lift + neon edge + inner spotlight that follows the mouse */
  .card { position: relative; transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s; }
  .card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.22); box-shadow: 0 20px 50px -34px rgba(0,0,0,.9); }
  /* Skill → project/role link highlight */
  .pick { border-color: rgba(127,169,255,.75) !important; box-shadow: inset 0 0 0 1px rgba(127,169,255,.35); }

  /* Scroll reveal — elements slide in as they enter the viewport */
  .reveal { opacity: 0; transform: translateY(26px); filter: blur(6px);
            transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1), filter .8s;
            transition-delay: var(--delay, 0s); }
  .reveal.visible { opacity: 1; transform: none; filter: none; }

  /* Typing caret in the hero */
  .caret { display: inline-block; width: 2px; height: 1em; background: #7FA9FF;
           vertical-align: -.13em; margin-left: 4px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Left-rail progress + active dot */
  .rail-dot { transition: all .35s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
  .nav-item.active .rail-dot { background: #FFF; box-shadow: 0 0 0 5px rgba(255,255,255,.14), 0 0 18px rgba(255,255,255,.9); transform: scale(1.3); }
  .nav-item:hover .rail-dot { border-color: #FFF; }
  .nav-item.active .nav-label { color: #FFF; letter-spacing: .14em; }

  /* Timeline connector for the education section */
  .tl-item::before { content:''; position:absolute; left:-30px; top:6px; width:13px; height:13px; border-radius:50%;
                     background:#07070A; border:2px solid #1C1C26; transition:all .4s; }
  .tl-item.visible::before { border-color:#7FA9FF; }

  /* Small fade used when switching experience tabs */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Floating animation for the hero badge */
  @keyframes float { 50% { transform: translateY(-9px); } }
  .float { animation: float 5s ease-in-out infinite; }

  /* Respect users who prefer less motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; filter: none; }
  }
</style>
</head>

<body class="font-body antialiased selection:bg-accent">

<!-- Background layers -->
<canvas id="stars" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- Top scroll-progress bar -->
<div class="fixed top-0 left-0 right-0 h-[2px] z-50 bg-transparent">
  <div id="topProgress" class="h-full origin-left scale-x-0 bg-white/70"></div>
</div>

<!-- ================================================================
     STICKY LEFT SIDEBAR  (desktop ≥ 1024px)
     ================================================================ -->
<aside class="flex fixed left-0 top-0 bottom-0 w-[60px] sm:w-[74px] lg:w-[260px] z-40 flex-col justify-between py-8 sm:py-10 px-[14px] sm:px-5 lg:px-8 transition-[width]">
  <!-- Monogram / name -->
  <a href="#home" class="block">
    <div class="flex items-center gap-3">
      <span class="grid h-11 w-11 place-items-center rounded-xl bg-gradient-to-br from-accent to-accent2 font-display font-bold text-black">DP</span>
      <span class="hidden lg:block">
        <span id="sideName" class="block font-display font-semibold tracking-tight">Divy Patel</span>
        <span class="block text-[11px] font-mono uppercase tracking-[.18em] text-white/40">Portfolio</span>
      </span>
    </div>
  </a>

  <!-- Vertical rail navigation with scroll progress -->
  <nav class="relative flex-1 py-12" aria-label="Section navigation">
    <!-- the rail line + the fill that tracks scroll progress -->
    <div class="absolute left-[6px] top-2 bottom-2 w-px bg-white/20"></div>
    <div id="railFill" class="absolute left-[6px] top-2 w-px origin-top scale-y-0 bg-white
                              shadow-[0_0_12px_rgba(255,255,255,.8)]" style="bottom:.5rem"></div>
    <ul id="navList" class="flex h-full flex-col justify-between"><!-- items injected by JS --></ul>
  </nav>

  <!-- Socials + availability -->
  <div class="space-y-5">
    <div id="sideSocials" class="flex flex-col lg:flex-row gap-3"><!-- injected --></div>
  </div>
</aside>

<!-- ================================================================
     MAIN CONTENT
     ================================================================ -->
<main class="relative z-10 ml-[60px] sm:ml-[74px] lg:ml-[260px]">
  <div class="mx-auto w-full max-w-5xl px-5 sm:px-8">

    <!-- ============================ HOME / HERO ============================ -->
    <section id="home" class="min-h-[88vh] flex flex-col justify-center py-24 lg:py-28">
      <div class="grid items-center gap-10 md:grid-cols-[1fr_auto] md:gap-16">
        <div>
          <h1 class="reveal font-display text-5xl sm:text-6xl lg:text-7xl font-bold leading-[1.02] tracking-tight">
            <span class="grad-text" id="heroName">Divy Patel</span>
          </h1>

          <!-- Typing animation cycles through DATA.roles -->
          <p class="reveal mt-6 font-mono text-base sm:text-xl text-white/70" style="--delay:.08s">
            <span class="text-accent">&gt;</span> <span id="typewriter"></span><span class="caret" aria-hidden="true"></span>
          </p>

          <p class="reveal mt-6 max-w-xl text-base sm:text-lg leading-relaxed text-white/55" style="--delay:.16s" id="heroBlurb"></p>

          <!-- Quick links: Resume / Phone / GitHub / LinkedIn -->
          <div class="reveal mt-10 flex flex-wrap gap-3" style="--delay:.24s" id="heroLinks"></div>
        </div>

        <!-- PROFILE PICTURE — swap the src in DATA.photo -->
        <div class="reveal order-first md:order-last justify-self-center" style="--delay:.1s">
          <img id="heroPhoto" alt="Divy Patel" width="680" height="850"
               class="h-44 w-44 sm:h-56 sm:w-56 md:h-64 md:w-64 rounded-full object-cover object-center
                      border border-white/15 shadow-[0_18px_60px_-25px_rgba(0,0,0,.9)]">
        </div>
      </div>
    </section>

    <!-- ============================ EDUCATION ============================ -->
    <section id="education" class="py-24 lg:py-28">
      <header class="reveal mb-14">
        <h2 class="font-display text-4xl sm:text-5xl font-bold tracking-tight grad-text">Education</h2>
      </header>
      <div class="relative border-l border-line pl-8 ml-[6px] space-y-10" id="educationList"><!-- injected --></div>
    </section>

    <!-- ============================ EXPERIENCE ============================ -->
    <section id="experience" class="py-24 lg:py-28">
      <header class="reveal mb-14">
        <h2 class="font-display text-4xl sm:text-5xl font-bold tracking-tight grad-text">Experience</h2>
      </header>
      <!-- One card per role, stacked in scroll order -->
      <div id="expList" class="space-y-5"></div>
    </section>

    <!-- ============================ PROJECTS ============================ -->
    <section id="projects" class="py-24 lg:py-28">
      <header class="reveal mb-8">
        <h2 class="font-display text-4xl sm:text-5xl font-bold tracking-tight grad-text">Projects</h2>
      </header>
      <!-- Category filters -->
      <div id="projFilters" class="reveal mb-10 flex flex-wrap gap-2"></div>
      <div id="projectGrid" class="grid gap-5 sm:grid-cols-2"><!-- injected --></div>
    </section>

    <!-- ============================ SKILLS ============================ -->
    <section id="skills" class="py-24 lg:py-28">
      <header class="reveal mb-14">
        <h2 class="font-display text-4xl sm:text-5xl font-bold tracking-tight grad-text">Skills</h2>
        <p class="mt-4 max-w-lg text-white/45">The number on a skill is how many roles and projects I used it in — click one to see where.</p>
      </header>
      <!-- Shows where a clicked skill was used -->
      <div id="skillLink" class="reveal mb-6 hidden rounded-xl border border-accent/40 bg-accent/[.06] px-5 py-4 text-sm"></div>
      <div id="skillGroups" class="grid gap-5 sm:grid-cols-2"><!-- injected --></div>
      <div id="softSkills" class="mt-5"><!-- injected --></div>
    </section>

    <!-- ============================ CONTACT ============================ -->
    <section id="contact" class="py-24 lg:py-28">
      <header class="reveal mb-14">
        <h2 class="font-display text-4xl sm:text-5xl font-bold tracking-tight grad-text">Contact</h2>
        <p class="mt-5 max-w-lg text-white/55">Have a project, a question or an idea? Send me a message and I'll get back to you.</p>
      </header>

      <div class="grid gap-6 lg:grid-cols-[1fr_320px]">
        <!-- Contact form (front-end only — see the JS comment to wire a backend) -->
        <form id="contactForm" class="reveal glass rounded-2xl p-6 sm:p-8 space-y-5" novalidate>
          <div class="grid gap-5 sm:grid-cols-2">
            <label class="block">
              <span class="mb-2 block font-mono text-[11px] uppercase tracking-[.16em] text-white/50">Your name</span>
              <input id="fName" name="name" type="text" required placeholder="Ada Lovelace"
                     class="w-full rounded-xl border border-line bg-black/50 px-4 py-3 text-[15px] outline-none transition placeholder:text-white/25 focus:border-accent focus:ring-2 focus:ring-accent/25">
            </label>
            <label class="block">
              <span class="mb-2 block font-mono text-[11px] uppercase tracking-[.16em] text-white/50">Email</span>
              <input id="fEmail" name="email" type="email" required placeholder="you@company.com"
                     class="w-full rounded-xl border border-line bg-black/50 px-4 py-3 text-[15px] outline-none transition placeholder:text-white/25 focus:border-accent focus:ring-2 focus:ring-accent/25">
            </label>
          </div>
          <label class="block">
            <span class="mb-2 block font-mono text-[11px] uppercase tracking-[.16em] text-white/50">Message</span>
            <textarea id="fMsg" name="message" rows="5" required placeholder="Tell me about the role or idea…"
                      class="w-full resize-y rounded-xl border border-line bg-black/50 px-4 py-3 text-[15px] outline-none transition placeholder:text-white/25 focus:border-accent focus:ring-2 focus:ring-accent/25"></textarea>
          </label>
          <p id="formError" class="hidden text-sm text-rose-400"></p>
          <button type="submit"
                  class="group inline-flex items-center gap-2 rounded-xl bg-white px-6 py-3 font-medium text-black transition hover:-translate-y-0.5 hover:bg-white/90">
            <span id="submitLabel">Send message</span>
            <svg class="h-4 w-4 transition group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>

        <!-- Direct contact details -->
        <aside class="reveal space-y-3" style="--delay:.1s" id="contactCards"></aside>
      </div>

      <footer class="mt-20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-t border-line pt-8 text-sm text-white/35">
        <span id="footerLine">© 2026 Divy Patel</span>
        <a href="#home" class="transition hover:text-accent">Back to top ↑</a>
      </footer>
    </section>
  </div>
</main>

(function typewriter() {
  const node = $("#typewriter");
  if (reduced) { node.textContent = DATA.roles.join("  |  "); return; }
  let r = 0, c = 0, deleting = false;
  (function tick() {
    const word = DATA.roles[r];
    c += deleting ? -1 : 1;
    node.textContent = word.slice(0, c);
    let wait = deleting ? 40 : 85;
    if (!deleting && c === word.length) { deleting = true; wait = 1800; }
    else if (deleting && c === 0) { deleting = false; r = (r + 1) % DATA.roles.length; wait = 260; }
    setTimeout(tick, wait);
  })();
})();

/* --- Scroll reveal via IntersectionObserver --- */
function observeReveals() {
  if (reduced) { $$(".reveal").forEach(n => n.classList.add("visible")); return; }
  revealObserver ||= new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add("visible");
      revealObserver.unobserve(en.target);
    });
  }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });
  $$(".reveal:not(.visible)").forEach(n => revealObserver.observe(n));
}
observeReveals();

/* --- Active-section highlighting + rail progress fill --- */
const sectionEls = DATA.sections.map(s => document.getElementById(s.id)).filter(Boolean);
const railFill = $("#railFill"), topProgress = $("#topProgress");
let ticking = false;

function onScroll() {
  ticking = false;
  const vh = innerHeight;
  const docH = document.documentElement.scrollHeight - vh;
  const progress = docH > 0 ? scrollY / docH : 0;

  topProgress.style.transform = `scaleX(${progress})`;
  railFill.style.transform = `scaleY(${progress})`;

  // The current section is the last one whose top has crossed 45% of the viewport
  let current = sectionEls[0]?.id;
  for (const s of sectionEls) if (s.getBoundingClientRect().top < vh * 0.45) current = s.id;
  $$("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === current));
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

const FORM_ENDPOINT = "";   // ← e.g. "https://formspree.io/f/xxxxxxx"

$("#contactForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#fName").value.trim();
  const email = $("#fEmail").value.trim();
  const message = $("#fMsg").value.trim();
  const err = $("#formError");

  // Validate
  if (!name || !email || !message) return showError("Please fill in every field.");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return showError("That email address doesn't look right.");
  err.classList.add("hidden");

  if (FORM_ENDPOINT) {
    // Real submission path
    try {
      const res = await fetch(FORM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ name, email, message }),
      });
      if (!res.ok) throw new Error("Request failed");
      success();
    } catch { showError("Something went wrong — please email me directly."); }
  } else {
    // No backend configured: open the visitor's mail client, pre-filled
    const subject = encodeURIComponent(`Portfolio message from ${name}`);

  function success() {
    $("#submitLabel").textContent = "Message ready ✓";

});

/* ==================================================================
   5. STARFIELD CANVAS
   Three parallax layers of stars, gentle twinkle, occasional shooting
   star, and a subtle drift that follows both scroll and the cursor.
   ================================================================== */
(function starfield() {
  const cv = $("#stars"), ctx = cv.getContext("2d");
  const DPR = Math.min(devicePixelRatio || 1, 2);
  let w = 0, h = 0, stars = [], shooting = null, mouseX = 0, mouseY = 0;

  function resize() {
    w = cv.width = Math.floor(innerWidth * DPR);
    h = cv.height = Math.floor(innerHeight * DPR);
    cv.style.width = innerWidth + "px";
    cv.style.height = innerHeight + "px";
    const count = Math.min(300, Math.floor((innerWidth * innerHeight) / 5200));
    stars = Array.from({ length: count }, () => {
      const depth = Math.random();                       // 0 = far, 1 = near
      return {
        x: Math.random() * w, y: Math.random() * h,
        r: (0.4 + depth * 1.5) * DPR,
        depth,
        tw: Math.random() * Math.PI * 2,                 // twinkle phase
        hue: "255,255,255",
      };
    });
  }
  resize();
  addEventListener("resize", resize);
  addEventListener("pointermove", e => { mouseX = (e.clientX / innerWidth - 0.5) * 2; mouseY = (e.clientY / innerHeight - 0.5) * 2; }, { passive: true });

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    const scroll = scrollY * DPR;
    for (const s of stars) {
      // Parallax: nearer stars move more with scroll and cursor
      const y = (s.y - scroll * (0.05 + s.depth * 0.22)) % h;
      const x = s.x + mouseX * s.depth * 14 * DPR;
      const alpha = 0.35 + 0.45 * Math.abs(Math.sin(t * 0.0012 + s.tw)) * (0.4 + s.depth);
      ctx.beginPath();
      ctx.fillStyle = `rgba(${s.hue},${Math.min(alpha, 1)})`;
      ctx.arc(x, y < 0 ? y + h : y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    // Occasional shooting star
    if (!shooting && Math.random() < 0.0016) {
      shooting = { x: Math.random() * w * 0.8, y: Math.random() * h * 0.5, len: 0, life: 0 };
    }
    if (shooting) {
      shooting.life++; shooting.len = Math.min(shooting.life * 9 * DPR, 190 * DPR);
      const gx = shooting.x + shooting.life * 9 * DPR, gy = shooting.y + shooting.life * 4 * DPR;
      const grad = ctx.createLinearGradient(gx - shooting.len, gy - shooting.len * 0.45, gx, gy);
      grad.addColorStop(0, "rgba(255,255,255,0)");
      grad.addColorStop(1, "rgba(255,255,255,.85)");
      ctx.strokeStyle = grad; ctx.lineWidth = 1.6 * DPR; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(gx - shooting.len, gy - shooting.len * 0.45); ctx.lineTo(gx, gy); ctx.stroke();
      if (shooting.life > 55) shooting = null;
    }
  }
  if (reduced) { draw(0); return; }                      // static sky, no animation loop
  (function loop(t) { if (!document.hidden) draw(t); requestAnimationFrame(loop); })(0);
})();
</script>
